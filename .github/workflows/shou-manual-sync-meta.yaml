name: Mirror SHOU-Online-Manual metadata to Gitea

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 */2 * *" # hourly; change or remove as desired
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the controller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: pip install requests

      - name: Sync issues, pull requests, and releases
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN_01 }}
          SOURCE_GITHUB_REPO: "Conduit-Club/SHOU-Online-Manual"
          GITEA_OWNER: "LagrangeWithLight"
          GITEA_REPO: "SHOU-Online-Manual-Mirror"
          GITEA_API: https://gitea.com/api/v1
        run: python scripts/sync_metadata.py
